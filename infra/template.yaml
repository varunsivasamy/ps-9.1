AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: PS-9.1 Graduated Autonomy Engine — Lambda + API Gateway + DynamoDB

# ── Parameters ─────────────────────────────────────────────────────────────
Parameters:
  GroqApiKey:
    Type: String
    NoEcho: true
    Description: Groq API key for the agent LLM

  CorsAllowedOrigin:
    Type: String
    Default: "https://agent-rish-console.vercel.app"
    Description: Frontend origin allowed by CORS (your Vercel URL)

  TablePrefix:
    Type: String
    Default: "ps-9-1-autonomy-engine"
    Description: Prefix for DynamoDB table names

# ── Globals ────────────────────────────────────────────────────────────────
Globals:
  Function:
    Runtime: python3.12
    Architectures: [x86_64]
    Timeout: 60          # Groq calls can take ~10s; 60s gives headroom
    MemorySize: 512
    Environment:
      Variables:
        GROQ_API_KEY: !Ref GroqApiKey
        DYNAMODB_TABLE_PREFIX: !Ref TablePrefix
        AWS_REGION_NAME: !Ref AWS::Region
        CORS_ALLOWED_ORIGINS: !Ref CorsAllowedOrigin

# ── Resources ──────────────────────────────────────────────────────────────
Resources:

  # ── DynamoDB audit-log table ──────────────────────────────────────────────
  AuditLogTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${TablePrefix}-audit-log"
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: session_id
          KeyType: HASH
        - AttributeName: timestamp
          KeyType: RANGE
      AttributeDefinitions:
        - AttributeName: session_id
          AttributeType: S
        - AttributeName: timestamp
          AttributeType: S

  # ── Lambda function ───────────────────────────────────────────────────────
  AutonomyEngineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: autonomy-engine
      Handler: autonomy_engine.lambda_handler.handler
      CodeUri: ../
      Description: FastAPI autonomy engine wrapped with Mangum
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref AuditLogTable
      Events:
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref AutonomyApi
            Path: /{proxy+}
            Method: ANY
        ApiHealth:
          Type: HttpApi
          Properties:
            ApiId: !Ref AutonomyApi
            Path: /health
            Method: GET

  # ── API Gateway HTTP API ──────────────────────────────────────────────────
  AutonomyApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Description: HTTP API for the autonomy engine
      CorsConfiguration:
        AllowOrigins:
          - !Ref CorsAllowedOrigin
        AllowMethods:
          - GET
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type
          - Authorization

# ── Outputs ────────────────────────────────────────────────────────────────
Outputs:
  ApiUrl:
    Description: "API Gateway base URL — set this as VITE_API_BASE_URL in Vercel"
    Value: !Sub "https://${AutonomyApi}.execute-api.${AWS::Region}.amazonaws.com"

  FunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt AutonomyEngineFunction.Arn

  TableName:
    Description: DynamoDB audit-log table name
    Value: !Ref AuditLogTable
